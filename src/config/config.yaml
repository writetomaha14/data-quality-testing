valid_statuses:
  - Active
  - Inactive
  - Pending

salary_range:
  min: 0
  max: 1000000

thresholds:
  null_warning_pct: 5
  null_fail_pct: 20

foreign_keys:
  - child_table: orders
    child_key: customer_id
    parent_table: customers
    parent_key: customer_id
    composite: false

  - child_table: order_line_items
    child_key: [order_id, product_id]
    parent_table: order_products
    parent_key: [order_id, product_id]
    composite: true

expected_schemas:
  employees:
    - [employee_id, integer]
    - [name, string]
    - [manager_id, double]