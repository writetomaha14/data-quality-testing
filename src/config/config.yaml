valid_statuses:
  - Active
  - Inactive
  - Pending

salary_range:
  min: 0
  max: 1000000

thresholds:
  null_warning_pct: 5
  null_fail_pct: 20

foreign_keys:
  - child_table: orders
    child_key: customer_id
    parent_table: customers
    parent_key: customer_id
    composite: false

  - child_table: order_line_items
    child_key: [order_id, product_id]
    parent_table: order_products
    parent_key: [order_id, product_id]
    composite: true

expected_schemas:
  employees:
    - [employee_id, integer]
    - [name, string]
    - [manager_id, double]

consistency_rules:
  - name: ship_after_order
    expression: "ship_date >= order_date"
  - name: total_matches_calculation
    expression: "ABS(total - (quantity * unit_price)) < 0.01"

business_rules:
  - name: valid_status_enum
    expression: "status IN ('active', 'shipped', 'pending', 'closed')"
  - name: discount_within_total
    expression: "discount <= total"

reconciliation:
  - check: record_count
  - check: sum
    column: total
  - check: row_level
    key_columns: [order_id]

anomaly_checks:
  - method: z_score
    column: sales_amount
    threshold: 2.0
  - method: z_score
    column: units_sold
    threshold: 2.0
  - method: iqr
    column: sales_amount
    multiplier: 1.5
  - method: iqr
    column: units_sold
    multiplier: 1.5